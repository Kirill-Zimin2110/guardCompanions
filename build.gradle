plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.149'
}

group = 'net.bro'
version = '1.0.0'

base {
    archivesName = 'guardcompanion'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.268'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        guardcompanion {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
